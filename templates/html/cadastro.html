<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGF - Cadastro</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <script src="/scripts/cadastro.js" defer></script>
</head>
<body>
    <header>
        <h1>SGF - Sistema de Gerenciamento Financeiro</h1>
    </header>

    <main> 
        <section>
            <h2>Criar conta</h2>

            <form id="formCadastro">
                <div>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" minlength="6" required>
                </div>

                <div>
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" required>
                </div>

                <button type="submit">Cadastrar</button>
            </form>

            <p id="mensagem"></p>

            <p>
                Já possui uma conta?
                <a href="/html/login.html">Fazer login</a>
            </p>
        </section>
    </main>

    <footer>
        <p>SGF - Sistema de Gerenciamento Financeiro</p>
    </footer>
</body>
</html>
